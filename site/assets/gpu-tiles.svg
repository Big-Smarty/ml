<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">A workgroup reuses a pair of matrix tiles</title><desc id="desc">A tile from matrix A and a tile from matrix B are cooperatively loaded from device memory into workgroup memory. After a barrier every invocation accumulates its output element. A second barrier protects the tile before the next tile is loaded.</desc><rect width="720" height="330" rx="18" fill="#f4f2eb"/><g font-family="system-ui,sans-serif" fill="#203b30" text-anchor="middle"><rect x="35" y="45" width="180" height="55" rx="8" fill="#dce5d7" stroke="#789080"/><text x="125.0" y="78.5" font-size="17">A tile</text><rect x="265" y="45" width="180" height="55" rx="8" fill="#dce5d7" stroke="#789080"/><text x="355.0" y="78.5" font-size="17">B tile</text><rect x="35" y="150" width="410" height="55" rx="8" fill="#dce5d7" stroke="#789080"/><text x="240.0" y="183.5" font-size="17">Workgroup memory: shared tiles</text><rect x="485" y="150" width="200" height="55" rx="8" fill="#ecd8c8" stroke="#789080"/><text x="585.0" y="183.5" font-size="17">Output accumulators</text><text x="240" y="27" font-size="15">Device buffers</text><path d="M125 103v10M125 138v7m-6-6 6 6 6-6M355 103v10M355 138v7m-6-6 6 6 6-6M448 177h32m-9-6 9 6-9 6" stroke="#466553" stroke-width="2" fill="none"/><text x="240" y="132" font-size="14">Cooperative load; pad missing values with zero</text><text x="240" y="238" font-size="16">Barrier → multiply and accumulate → barrier</text><text x="360" y="278" font-size="15">Repeat over inner-dimension tiles, then write valid output elements.</text><text x="360" y="310" font-size="14">Every invocation reaches both barriers, including boundary invocations.</text></g></svg>
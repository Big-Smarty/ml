<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="title desc">
<title id="title">One token through a sparse expert branch</title>
<desc id="desc">The token's normalized hidden vector enters a router that scores three experts. Only expert zero executes. Its output is multiplied by its probability from the full router softmax. A residual path adds the unchanged hidden state to this gated update. Unselected experts keep their parameters but do not execute for this token.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b04c32"/></marker></defs>
<rect width="800" height="410" rx="18" fill="#f4f2eb"/>
<g fill="none" stroke="#b04c32" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M100 230H150V87H185"/><path d="M100 230H220V180H305"/>
<path d="M375 87H595V170"/><path d="M475 180H560"/>
<path d="M650 190H710V274"/><path d="M100 230V340H710V320"/>
<path d="M736 297H775"/>
</g>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#203b30">
<text x="400" y="34" font-size="20" font-weight="600">Sparse computation inside the feed-forward branch</text>
<circle cx="75" cy="230" r="25" fill="#dce5d7" stroke="#789080"/>
<text x="75" y="236" font-size="21">x</text>
<rect x="185" y="60" width="190" height="55" rx="8" fill="#dce5d7" stroke="#789080"/>
<text x="280" y="84" font-size="17">Normalize → router</text><text x="280" y="104" font-size="13">scores all three experts</text>
<text x="505" y="72" font-size="16">p = [0.665, 0.245, 0.090]</text>
<rect x="305" y="150" width="170" height="60" rx="8" fill="#ecd8c8" stroke="#b04c32" stroke-width="2"/>
<text x="390" y="176" font-size="18">Expert 0</text><text x="390" y="198" font-size="14">executes on LN(x)</text>
<rect x="305" y="224" width="170" height="42" rx="8" fill="#f4f2eb" stroke="#789080" stroke-dasharray="5 4"/>
<text x="390" y="251" font-size="16">Expert 1 · skipped</text>
<rect x="305" y="280" width="170" height="42" rx="8" fill="#f4f2eb" stroke="#789080" stroke-dasharray="5 4"/>
<text x="390" y="307" font-size="16">Expert 2 · skipped</text>
<rect x="560" y="170" width="90" height="42" rx="8" fill="#ecd8c8" stroke="#b04c32"/>
<text x="605" y="197" font-size="18">× 0.665</text>
<circle cx="710" cy="297" r="24" fill="#dce5d7" stroke="#789080"/><text x="710" y="304" font-size="25">+</text>
<text x="171" y="362" font-size="15">Unchanged residual path</text>
<text x="400" y="391" font-size="16">Keep the selected full-softmax gate: dividing it by itself would erase its task gradient.</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">Causal attention permits only the past and present</title><desc id="desc">Four query rows and four key columns. Row zero can read key zero; row one can read keys zero and one; row two can read keys zero through two; row three can read all four. Future keys are masked.</desc><rect width="720" height="330" rx="18" fill="#f4f2eb"/><g font-family="system-ui,sans-serif" fill="#203b30" text-anchor="middle"><text x="298" y="30" font-size="18">Keys: positions being read</text><text x="225" y="58" font-size="14">0</text><text x="279" y="58" font-size="14">1</text><text x="333" y="58" font-size="14">2</text><text x="387" y="58" font-size="14">3</text><text x="182" y="99" font-size="14">0</text><rect x="200" y="70" width="49" height="49" rx="5" fill="#dce5d7" stroke="#789080"/><text x="225" y="101" font-size="20">✓</text><rect x="254" y="70" width="49" height="49" rx="5" fill="#ecd8c8" stroke="#b57655"/><text x="279" y="101" font-size="20">×</text><rect x="308" y="70" width="49" height="49" rx="5" fill="#ecd8c8" stroke="#b57655"/><text x="333" y="101" font-size="20">×</text><rect x="362" y="70" width="49" height="49" rx="5" fill="#ecd8c8" stroke="#b57655"/><text x="387" y="101" font-size="20">×</text><text x="182" y="153" font-size="14">1</text><rect x="200" y="124" width="49" height="49" rx="5" fill="#dce5d7" stroke="#789080"/><text x="225" y="155" font-size="20">✓</text><rect x="254" y="124" width="49" height="49" rx="5" fill="#dce5d7" stroke="#789080"/><text x="279" y="155" font-size="20">✓</text><rect x="308" y="124" width="49" height="49" rx="5" fill="#ecd8c8" stroke="#b57655"/><text x="333" y="155" font-size="20">×</text><rect x="362" y="124" width="49" height="49" rx="5" fill="#ecd8c8" stroke="#b57655"/><text x="387" y="155" font-size="20">×</text><text x="182" y="207" font-size="14">2</text><rect x="200" y="178" width="49" height="49" rx="5" fill="#dce5d7" stroke="#789080"/><text x="225" y="209" font-size="20">✓</text><rect x="254" y="178" width="49" height="49" rx="5" fill="#dce5d7" stroke="#789080"/><text x="279" y="209" font-size="20">✓</text><rect x="308" y="178" width="49" height="49" rx="5" fill="#dce5d7" stroke="#789080"/><text x="333" y="209" font-size="20">✓</text><rect x="362" y="178" width="49" height="49" rx="5" fill="#ecd8c8" stroke="#b57655"/><text x="387" y="209" font-size="20">×</text><text x="182" y="261" font-size="14">3</text><rect x="200" y="232" width="49" height="49" rx="5" fill="#dce5d7" stroke="#789080"/><text x="225" y="263" font-size="20">✓</text><rect x="254" y="232" width="49" height="49" rx="5" fill="#dce5d7" stroke="#789080"/><text x="279" y="263" font-size="20">✓</text><rect x="308" y="232" width="49" height="49" rx="5" fill="#dce5d7" stroke="#789080"/><text x="333" y="263" font-size="20">✓</text><rect x="362" y="232" width="49" height="49" rx="5" fill="#dce5d7" stroke="#789080"/><text x="387" y="263" font-size="20">✓</text><text x="82" y="142" font-size="16">Query</text><text x="82" y="165" font-size="16">position</text><text x="565" y="118" font-size="17">✓ Included in softmax</text><text x="565" y="151" font-size="17">× Logit becomes −∞</text><text x="565" y="206" font-size="14">The current token may see itself.</text><text x="565" y="230" font-size="14">Its target is the next token.</text><text x="360" y="311" font-size="16">Allowed when key position ≤ query position</text></g></svg>
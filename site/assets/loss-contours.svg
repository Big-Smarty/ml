<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 340" role="img" aria-labelledby="t d"><title id="t">Loss contours for the first neuron</title><desc id="d">Ellipses mark equal loss around weight two and bias one. Starting at zero, gradient descent takes the first step to weight 0.8 and bias 0.2, reducing mean squared error from nine to 3.52.</desc><rect width="650" height="340" rx="12" fill="#f1f0e7"/><g font-family="system-ui,sans-serif" fill="#253329"><g stroke="#c6cdbe" stroke-width="1"><path d="M50 270H470M120 290V20"/><ellipse cx="260" cy="150" rx="148.49" ry="120" fill="none"/><ellipse cx="260" cy="150" rx="98.995" ry="80" fill="none"/><ellipse cx="260" cy="150" rx="49.497" ry="40" fill="none"/></g><g font-size="12" fill="#5b6657"><text x="107" y="289">0</text><text x="185" y="289">1</text><text x="256" y="289">2</text><text x="326" y="289">3</text><text x="396" y="289">4</text><text x="450" y="291">weight</text><text x="91" y="24">bias</text><text x="101" y="193">0</text><text x="101" y="153">1</text><text x="101" y="113">2</text><text x="269" y="47">L = 9</text><text x="269" y="87">L = 4</text><text x="269" y="127">L = 1</text></g><g fill="#b04c32"><circle cx="120" cy="190" r="5"/><circle cx="176" cy="182" r="5"/><circle cx="260" cy="150" r="5"/></g><path d="M125 189L169 183M163 179L171 183L165 188" fill="none" stroke="#b04c32" stroke-width="2"/><g font-size="12"><text x="59" y="215">start (0, 0)</text><text x="151" y="234">step 1 (0.8, 0.2)</text><text x="275" y="165">minimum (2, 1)</text><text x="470" y="91">Same ellipse,</text><text x="470" y="109">same loss.</text><text x="470" y="151">Move against</text><text x="470" y="169">the local gradient.</text></g><text x="70" y="321" font-family="Georgia,serif" font-size="18">L(w, b) = 2(w − 2)² + (b − 1)²</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">The 2–2–1 XOR network</title><desc id="desc">Two inputs connect to two sigmoid hidden units. Both hidden units connect to one sigmoid output. Forward values travel left to right; loss gradients travel right to left.</desc><rect width="760" height="320" rx="12" fill="#f1f0e7"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#b04c32"/></marker></defs><g font-family="system-ui,sans-serif" fill="#253329"><g font-size="12" letter-spacing="2"><text x="95" y="42">INPUTS</text><text x="325" y="42">HIDDEN FEATURES</text><text x="622" y="42">OUTPUT</text></g><g stroke="#929d8a" stroke-width="2"><path d="M158 115L330 115M158 115L330 220M158 220L330 115M158 220L330 220M410 115L610 167M410 220L610 167"/></g><g fill="#fffdf8" stroke="#71826b" stroke-width="2"><circle cx="128" cy="115" r="30"/><circle cx="128" cy="220" r="30"/><circle cx="370" cy="115" r="40"/><circle cx="370" cy="220" r="40"/><circle cx="650" cy="167" r="40" fill="#f2dfce" stroke="#b04c32"/></g><g font-family="Georgia,serif" font-size="22" text-anchor="middle"><text x="128" y="122">x₀</text><text x="128" y="227">x₁</text><text x="370" y="123">σ(z₀)</text><text x="370" y="228">σ(z₁)</text><text x="650" y="175">p</text></g><g font-size="12" fill="#5b6657"><text x="224" y="100">wⱼₖ</text><text x="495" y="118">vⱼ</text><text x="616" y="235">compare with y</text></g><g stroke="#b04c32" fill="none" stroke-width="1.5" marker-end="url(#a)"><path d="M128 70H642"/><path d="M645 281H132"/></g><g font-size="11" text-anchor="middle"><text x="387" y="64">FORWARD · compute predictions</text><text x="387" y="304">BACKWARD · accumulate responsibility for the error</text></g></g></svg>

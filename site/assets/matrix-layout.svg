<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">Two matrix rows stored in one flat array</title><desc id="desc">A two by three matrix has first row one two three, and second row four five six. The flat array stores one two three four five six at offsets zero through five. Row one column two maps to offset five.</desc>
<rect width="720" height="300" rx="18" fill="#f4f2eb"/>
<g font-family="system-ui,sans-serif" fill="#203b30" text-anchor="middle"><text x="165" y="36" font-size="18">Logical shape [2, 3]</text><text x="524" y="36" font-size="18">Contiguous storage</text>
<g fill="#dce5d7" stroke="#789080"><rect x="70" y="62" width="60" height="60" rx="6"/><rect x="135" y="62" width="60" height="60" rx="6"/><rect x="200" y="62" width="60" height="60" rx="6"/></g>
<g fill="#ecd8c8" stroke="#b57655"><rect x="70" y="130" width="60" height="60" rx="6"/><rect x="135" y="130" width="60" height="60" rx="6"/><rect x="200" y="130" width="60" height="60" rx="6"/></g>
<g font-size="24"><text x="100" y="101">1</text><text x="165" y="101">2</text><text x="230" y="101">3</text><text x="100" y="169">4</text><text x="165" y="169">5</text><text x="230" y="169">6</text></g>
<text x="43" y="99" font-size="14">0</text><text x="43" y="167" font-size="14">1</text><text x="163" y="214" font-size="13">Rows 0 and 1</text>
<path d="M285 123h51m-9-8 9 8-9 8" stroke="#466553" fill="none" stroke-width="3"/>
<g stroke="#789080" fill="#dce5d7"><rect x="350" y="92" width="55" height="60"/><rect x="405" y="92" width="55" height="60"/><rect x="460" y="92" width="55" height="60"/></g>
<g stroke="#b57655" fill="#ecd8c8"><rect x="515" y="92" width="55" height="60"/><rect x="570" y="92" width="55" height="60"/><rect x="625" y="92" width="55" height="60"/></g>
<g font-size="24"><text x="377" y="131">1</text><text x="432" y="131">2</text><text x="487" y="131">3</text><text x="542" y="131">4</text><text x="597" y="131">5</text><text x="652" y="131">6</text></g>
<g font-size="13" fill="#647166"><text x="377" y="175">0</text><text x="432" y="175">1</text><text x="487" y="175">2</text><text x="542" y="175">3</text><text x="597" y="175">4</text><text x="652" y="175">5</text><text x="515" y="200">Array offsets</text></g>
<text x="360" y="265" font-size="19">offset = row × columns + column → 1 × 3 + 2 = 5</text></g></svg>
